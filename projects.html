    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const byId = Object.fromEntries(P.map((p) => [p.id, p]));
    const secTitle = Object.fromEntries(SECTIONS);

    /* ---- render ---- */
    const host = document.getElementById("sections");
    SECTIONS.forEach(([sid, title]) => {
      const items = P.filter((p) => p.sec === sid).sort((a, b) => (b.feat || 0) - (a.feat || 0));
      const sec = document.createElement("section");
      sec.id = sid; sec.setAttribute("data-search-group", "");
      let html = `<div class="mb-8"><h2 class="text-lg sm:text-3xl text-white bg-black/20 backdrop-blur-sm px-6 py-3 rounded-full inline-block max-w-full break-words">${title}</h2></div>`;
      const groups = [...new Set(items.map((p) => p.group || ""))];
      groups.forEach((g) => {
        html += `<div data-search-group class="mb-8">`;
        if (g) html += `<h3 class="text-sm sm:text-lg text-white bg-black/20 backdrop-blur-sm px-4 py-2 rounded-full inline-block mb-6 max-w-full break-words">${esc(g)}</h3>`;
        html += `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">`;
        items.filter((p) => (p.group || "") === g).forEach((p) => {
          const text = [p.title, p.blurb, p.desc, p.kind, p.date, secTitle[p.sec], p.group || "", p.tech.join(" ")].join(" ");

          <article data-search-item data-search-text="${esc(text)}" class="project-card relative rpg-box bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm overflow-hidden">

              <img src="${esc(p.img)}" alt="" width="400" height="300" loading="lazy" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">

              <h3 class="text-sm sm:text-base text-slate-800 dark:text-white mb-1"><button type="button" data-open="${esc(p.id)}" class="text-left after:absolute after:inset-0">${esc(p.title)}</button></h3>

          </article>`;

        html += `</div></div>`;
      });
      sec.innerHTML = html;
      host.appendChild(sec);
    });

    /* ---- modal ---- */
    const modal = document.getElementById("project-modal");
    const closeBtn = document.getElementById("modal-close-button");
    let lastFocus = null;

    function openModal(id, push) {
      const p = byId[id]; if (!p) return;

      document.getElementById("modal-project-title").textContent = p.title;
      document.getElementById("modal-project-meta").textContent = [p.kind, p.date].filter(Boolean).join(" | ");

      if (window.lucide) lucide.createIcons();
      modal.classList.remove("hidden"); modal.classList.add("flex");
      document.documentElement.classList.add("overflow-hidden");
      if (push) history.replaceState(null, "", "#" + id);
      closeBtn.focus();
    }
    function closeModal() {
      modal.classList.add("hidden"); modal.classList.remove("flex");
      document.documentElement.classList.remove("overflow-hidden");
      if (byId[location.hash.slice(1)]) history.replaceState(null, "", location.pathname);
      if (lastFocus) lastFocus.focus();
    }
    host.addEventListener("click", (e) => { const b = e.target.closest("[data-open]"); if (b) openModal(b.dataset.open, true); });
    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (modal.classList.contains("hidden")) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "Tab") {
        const f = [...modal.querySelectorAll("a[href],button")].filter((x) => !x.hidden);
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    /* deep links: projects.html#xr-teleop opens that project */
    const openFromHash = () => { const id = location.hash.slice(1); if (byId[id]) openModal(id, false); };
    openFromHash();
    window.addEventListener("hashchange", openFromHash);
  });
  </script>
</body>
</html>
